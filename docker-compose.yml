# Orienta v3 — local / offline stack (mirrors orienta_v2_step2 layout).
#
# PDR only (dashboard via npm on host):
#   docker compose up -d orienta-pdr
#   cd apps/dashboard && PDR_API_ORIGIN=http://127.0.0.1:10000 npm run dev:server
#
# Full stack in Docker (dashboard + PDR):
#   docker compose up -d

services:
  orienta:
    image: orienta-v3-dashboard:latest
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "${HOST_PORT:-5174}:5174"
    environment:
      PORT: "5174"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env}"
      ADMIN_CREDENTIALS: "${ADMIN_CREDENTIALS:?set ADMIN_CREDENTIALS}"
      PAX_ACCOUNT_CREDENTIALS: "${PAX_ACCOUNT_CREDENTIALS:-}"
      PDR_API_ORIGIN: "${PDR_API_ORIGIN:-http://orienta-pdr:10000}"
      INDOOR_MAP_UPSTREAM: "${INDOOR_MAP_UPSTREAM:-}"
      INDOOR_MAP_API_UPSTREAM: "${INDOOR_MAP_API_UPSTREAM:-}"
      VITE_LOCAL_AIRPORT_MAP: "${VITE_LOCAL_AIRPORT_MAP:-0}"
      ROUTE_SITE_DEFAULT_TENANT: "${ROUTE_SITE_DEFAULT_TENANT:-airchina}"
      DB_PATH: /app/data/passengers.db
      # Multi-instance backends (P2-1/P2-3). Empty → single-machine SQLite + in-memory.
      # Enable with: docker compose --profile scale up -d
      DATABASE_URL: "${DATABASE_URL:-}"
      REDIS_URL: "${REDIS_URL:-}"
      # P2-4: when set (e.g. /shared/video), video merges are served from the
      # shared volume produced by the orienta-video-worker.
      VIDEO_OUTPUT_DIR: "${VIDEO_OUTPUT_DIR:-}"
    volumes:
      - orienta-data:/app/data
      - orienta-video:/shared/video
    depends_on:
      orienta-pdr:
        # Wait for the PDR /health probe (baked into pdr_airchina/Dockerfile) to pass.
        condition: service_healthy
    restart: unless-stopped

  # ── Scale-out backends (opt-in: `docker compose --profile scale up -d`) ────────
  postgres:
    image: postgres:16-alpine
    profiles: ["scale"]
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-orienta}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-orienta}"
      POSTGRES_DB: "${POSTGRES_DB:-orienta}"
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - orienta-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orienta} -d ${POSTGRES_DB:-orienta}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["scale"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - orienta-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Video-merge worker (P2-4): runs the CPU-heavy ffmpeg concat off the web process.
  orienta-video-worker:
    image: orienta-video-worker:latest
    profiles: ["scale"]
    build:
      context: .
      dockerfile: apps/dashboard/worker/Dockerfile
    environment:
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      VIDEO_OUTPUT_DIR: /shared/video
      VIDEO_SOURCE_DIR: /src/route_site
      VIDEO_CSV_NAME: "${VIDEO_CSV_NAME:-PEK_gate_timestamp_full_with_E24_E36.csv}"
    volumes:
      - orienta-video:/shared/video
      - ./apps/dashboard/public/route_site:/src/route_site:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  orienta-pdr:
    image: orienta-pdr:latest
    build:
      context: .
      dockerfile: pdr_airchina/Dockerfile
    ports:
      - "${PDR_HOST_PORT:-10000}:10000"
    environment:
      PORT: "10000"
    restart: unless-stopped

volumes:
  orienta-data:
  orienta-pg:
  orienta-redis:
  orienta-video:
