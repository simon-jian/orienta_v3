# Orienta v3 — dashboard stack.
#
# PDR (pedestrian_dead_reckoning) is a separate service/repo, not built by
# this compose file — see README.md's "PDR" section. Run it yourself (locally
# via `npm run pdr:dev`, or wherever it's deployed) and point PDR_API_ORIGIN
# at it. Indoor map is Mode B external by default (7801 / 3001) — also not
# started here.
#
# Production-style boot (copy deploy.example.env → .env, fill secrets first):
#   docker compose --env-file deploy.example.env up -d --build
# The --env-file feeds Compose variable substitution; the service `environment`
# block below is what actually injects those values into the container.

services:
  orienta:
    image: orienta-v3-dashboard:latest
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "${HOST_PORT:-5174}:5174"
    environment:
      PORT: "5174"
      NODE_ENV: production
      # ── Auth (required for production boot) ──
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in deploy env}"
      JWT_SECRET_PREVIOUS: "${JWT_SECRET_PREVIOUS:-}"
      ADMIN_CREDENTIALS: "${ADMIN_CREDENTIALS:?set ADMIN_CREDENTIALS}"
      PAX_ACCOUNT_CREDENTIALS: "${PAX_ACCOUNT_CREDENTIALS:-}"
      KIOSK_SCAN_SECRET: "${KIOSK_SCAN_SECRET:?set KIOSK_SCAN_SECRET}"
      ADMIN_ROLES: "${ADMIN_ROLES:-}"
      ADMIN_TENANT_SCOPES: "${ADMIN_TENANT_SCOPES:-}"
      TOURIST_ALLOWED_ORIGINS: "${TOURIST_ALLOWED_ORIGINS:-}"
      # ── Upstream services ──
      # PDR is deployed separately (see README.md) — empty disables /pdr-api.
      PDR_API_ORIGIN: "${PDR_API_ORIGIN:-}"
      # Mode B (required for a navigable deploy today): map UI + POI API.
      # Leave empty only if you vendor Mode A assets into the image paths.
      INDOOR_MAP_UPSTREAM: "${INDOOR_MAP_UPSTREAM:-}"
      INDOOR_MAP_API_UPSTREAM: "${INDOOR_MAP_API_UPSTREAM:-}"
      VITE_LOCAL_AIRPORT_MAP: "${VITE_LOCAL_AIRPORT_MAP:-0}"
      FLIGHTAWARE_API_KEY: "${FLIGHTAWARE_API_KEY:-}"
      # ── Push / observability ──
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:ops@orienta.ai}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-}"
      SENTRY_RELEASE: "${SENTRY_RELEASE:-}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # ── App defaults ──
      ROUTE_SITE_DEFAULT_TENANT: "${ROUTE_SITE_DEFAULT_TENANT:-airchina}"
      DEFAULT_AIRPORT: "${DEFAULT_AIRPORT:-PEK}"
      DEFAULT_TERMINAL: "${DEFAULT_TERMINAL:-T3E}"
      AIRPORT_CONFIG_DIR: "${AIRPORT_CONFIG_DIR:-}"
      INSTANCE_ID: "${INSTANCE_ID:-}"
      DB_PATH: /app/data/passengers.db
      # Multi-instance backends (P2-1/P2-3). Empty → single-machine SQLite + in-memory.
      # Enable with: docker compose --profile scale up -d
      DATABASE_URL: "${DATABASE_URL:-}"
      REDIS_URL: "${REDIS_URL:-}"
    volumes:
      - orienta-data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    # NOTE: this service intentionally does NOT `depends_on: postgres`/`redis`.
    # Compose resolves `depends_on` at parse time regardless of which profile
    # is active, so referencing a `profiles: [scale]` service here would break
    # plain `docker compose up` (no --profile scale) with "invalid compose
    # project: depends on undefined service" — verified against this compose
    # file. When DATABASE_URL/REDIS_URL point at the scale-profile services,
    # the app's own `restart: unless-stopped` + Docker's backoff covers the
    # brief window before Postgres/Redis are ready: bootstrap() exits(1) on a
    # connection failure and the container restarts until it succeeds.

  # ── Scale-out backends (opt-in: `docker compose --profile scale up -d`) ────────
  postgres:
    image: postgres:16-alpine
    profiles: ["scale"]
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-orienta}"
      # Compose interpolates every service's env vars up front, even ones
      # gated by an inactive profile — a `:?required` here would break plain
      # `docker compose up` (no --profile scale) too (verified). The app
      # itself refuses to boot in production with this literal default
      # password (see server/config.ts validateProductionSecurity).
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-orienta}"
      POSTGRES_DB: "${POSTGRES_DB:-orienta}"
    # Bind to loopback only — do not expose Postgres on the LAN/public interface.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - orienta-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orienta} -d ${POSTGRES_DB:-orienta}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  redis:
    image: redis:7-alpine
    profiles: ["scale"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    # Set REDIS_PASSWORD in deploy env for anything beyond local play. Empty
    # keeps the old open-local behaviour (still loopback-bound below).
    # When set, point REDIS_URL at redis://:PASSWORD@redis:6379
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
    # Bind to loopback only.
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - orienta-redis:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

volumes:
  orienta-data:
  orienta-pg:
  orienta-redis:
