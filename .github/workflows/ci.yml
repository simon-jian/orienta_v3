name: CI

# Actions below are pinned to a commit SHA (not a mutable tag like @v4) so a
# compromised/rewritten tag upstream can't silently change what code runs in
# this pipeline — the trailing `# vX...` comment is just for humans; GitHub
# only trusts the SHA. To bump a version: find the new release's commit SHA
# (e.g. via the repo's /releases page or `git ls-remote --tags <repo>`),
# update both the SHA and the comment together.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  dashboard:
    name: Dashboard build, lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (2026-07-16)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (2026-07-16)
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build frontend
        run: npm run build

      - name: Build server
        run: npm run build:server

      - name: Run tests
        run: npm test

      # The esbuild/vite/vitest chain and react-router's two open-redirect /
      # constructor-injection CVEs were fixed by upgrading to vite@6,
      # vitest@3.2.7, and react-router-dom@7.18+ (2026-08). The one advisory
      # still open (GHSA-qwww-vcr4-c8h2, react-router's RSC-mode CSRF bypass)
      # only affects apps using react-router's unstable React Server
      # Components APIs — this app is a plain client-rendered SPA using
      # BrowserRouter/Routes/Route and doesn't use RSC anywhere, so it isn't
      # exploitable here. `npm audit` has no per-advisory ignore list, so this
      # stays non-blocking (with this comment as the record of why) rather
      # than downgrading react-router to silence it.
      - name: Audit dependencies (fails on high/critical)
        run: npm audit --audit-level=high
        continue-on-error: true

  pdr:
    name: PDR service build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdr_airchina
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (2026-07-16)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest backend/ -v

  postgres:
    name: Postgres-specific test coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: orienta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (2026-07-16)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (2026-07-16)
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Every other test file exercises SQLite only. sqlDb.pg.test.ts is
      # skipped everywhere else and only actually runs against a real
      # Postgres here — see that file for why (?-> $n placeholder rewrite,
      # ON CONFLICT semantics, and PgDb.transaction's dedicated-client
      # handling were previously never exercised before a --profile scale
      # (DATABASE_URL) deploy).
      - name: Run Postgres-specific tests
        run: npm test -- server/db/sqlDb.pg.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/orienta_test

  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (2026-07-16)

      - name: Build dashboard image
        run: docker build -f apps/dashboard/Dockerfile -t orienta-v3-dashboard:ci .

      - name: Build video-worker image
        run: docker build -f apps/dashboard/worker/Dockerfile -t orienta-video-worker:ci .

      - name: Build PDR image
        run: docker build -f pdr_airchina/Dockerfile -t orienta-pdr:ci .

      - name: Boot the PDR image and check /health
        run: |
          docker run -d --name orienta-pdr-ci -p 10000:10000 orienta-pdr:ci
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:10000/health; then exit 0; fi
            sleep 1
          done
          echo "PDR server did not become healthy in time"
          docker logs orienta-pdr-ci
          exit 1

      - name: Boot the dashboard image and check /health
        run: |
          # The image runs with NODE_ENV=production (set in the Dockerfile), which
          # makes server/config.ts validateProductionSecurity() refuse to start
          # unless ADMIN_CREDENTIALS is scrypt-hashed and KIOSK_SCAN_SECRET is set
          # — a plaintext password (the pre-fix version of this smoke test used
          # one) makes the container exit immediately, and this job would fail on
          # every run. Hash the password with the image's own built-in script so
          # the smoke test never drifts from whatever validateProductionSecurity()
          # currently requires.
          ADMIN_PASSWORD="$(openssl rand -hex 16)"
          ADMIN_HASH="$(docker run --rm orienta-v3-dashboard:ci node dist-server/server/scripts/hashAdminPassword.js "$ADMIN_PASSWORD")"
          docker run -d --name orienta-ci -p 5174:5174 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e ADMIN_CREDENTIALS="admin@ci.test:${ADMIN_HASH}" \
            -e KIOSK_SCAN_SECRET="$(openssl rand -hex 16)" \
            orienta-v3-dashboard:ci
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:5174/health; then exit 0; fi
            sleep 1
          done
          echo "server did not become healthy in time"
          docker logs orienta-ci
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: |
          docker logs orienta-ci || true
          docker logs orienta-pdr-ci || true
