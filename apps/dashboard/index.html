<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Orienta" />
    <title>Orienta公司后台</title>
    <link rel="icon" type="image/svg+xml" href="/orienta-logo.svg" />
    <link rel="apple-touch-icon" href="/orienta-logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /*
        Static (non-React) boot spinner: visible the instant the HTML paints,
        stays up through JS parse + the runtime-config fetch, and is removed
        by main.tsx once React has rendered something — either the real app
        or its crash fallback. Without this, a slow network on the config
        fetch (src/config/bootstrap.ts) left the page blank with no feedback.
      */
      #boot-loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px;
        background: #0b0d12; color: #9aa3af;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px; z-index: 9999;
      }
      #boot-loading .spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid #2a2f3a; border-top-color: #6b7280;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-loading"><div class="spinner"></div><div>Loading…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
