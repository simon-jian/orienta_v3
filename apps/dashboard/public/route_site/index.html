<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Orienta — video navigation retired</title>
<script src="../orienta-base.js"></script>
<style>
  :root {
    --bg: #0f1410;
    --fg: #e8efe9;
    --muted: #9aab9e;
    --accent: #c8e6c9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
    font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(ellipse 80% 50% at 20% 0%, #1a2e22 0%, transparent 55%),
      radial-gradient(ellipse 70% 40% at 90% 100%, #152018 0%, transparent 50%),
      var(--bg);
    color: var(--fg);
  }
  main {
    max-width: 28rem;
    text-align: center;
  }
  h1 {
    margin: 0 0 0.75rem;
    font-size: 1.35rem;
    font-weight: 650;
    letter-spacing: 0.01em;
  }
  p {
    margin: 0 0 0.85rem;
    color: var(--muted);
    line-height: 1.55;
    font-size: 0.98rem;
  }
  a.cta {
    display: inline-block;
    margin-top: 0.5rem;
    padding: 0.7rem 1.15rem;
    border-radius: 8px;
    background: var(--accent);
    color: #102016;
    font-weight: 650;
    text-decoration: none;
  }
  a.cta:hover { filter: brightness(1.05); }
  .en { font-size: 0.9rem; opacity: 0.9; }
</style>
</head>
<body>
<main>
  <h1>视频导航已下线</h1>
  <p>本页的视频路线导航已移除（体积大、加载慢）。室内导航改为地图图片 + PDR，请使用乘客端应用。</p>
  <p class="en">Video route navigation has been retired. Use the passenger app for map + PDR navigation.</p>
  <a class="cta" id="paxLink" href="/pax/app">打开乘客端 · Open /pax/app</a>
</main>
<script>
  (function () {
    var b = typeof window.__ORIENTA_BASE__ === "string" ? window.__ORIENTA_BASE__.replace(/\/+$/, "") : "";
    var a = document.getElementById("paxLink");
    if (a && b) a.setAttribute("href", b + "/pax/app");
  })();
</script>
</body>
</html>
