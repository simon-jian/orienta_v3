<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air China · 航班信息</title>

  <!-- Leaflet (OSM) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <style>
    /* Portal-style page + 国航红 (airchina.com) */
    :root {
      --ac-red: #c8102e;
      --bg: linear-gradient(180deg, #f7f8fb 0%, #eceff4 50%, #e2e6ed 100%);
      --card: #ffffff;
      --card2: #f3f5f8;
      --text: #1a1a1a;
      --muted: #6b7280;
      --line: #dce0e6;
      --blue: #c8102e;
      --green: #2e9d4f;
      --yellow: #b8860b;
      --red: #c8102e;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;
      border-top:4px solid var(--ac-red);
    }
    .wrap{max-width:980px;margin:0 auto;padding:14px;}
    .page-header{
      display:flex;align-items:center;justify-content:flex-start;gap:14px;
      margin:6px 0 12px;flex-wrap:wrap;
    }
    .brand-logo{
      height:76px;width:auto;max-width:min(380px,82vw);object-fit:contain;display:block;flex-shrink:0;
    }
    .page-header-main{flex:1;min-width:min(100%,200px);}
    .page-header .pill{margin-left:auto;flex-shrink:0;}
    @media(max-width:520px){
      .page-header .pill{margin-left:0;width:100%;}
    }
    .title{font-size:18px;font-weight:800;}
    .sub{font-size:12px;color:var(--muted);margin-top:2px;}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#eef1f5;border:1px solid var(--line);font-size:12px;color:var(--muted)}

    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 30px rgba(26,26,26,0.06);}
    .grid{display:grid;grid-template-columns:1fr;gap:12px;}
    @media(min-width:980px){.grid{grid-template-columns:1fr 1fr;}}

    .seg{display:inline-flex;gap:6px;background:var(--card2);padding:6px;border-radius:999px;border:1px solid var(--line)}
    .seg button{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:12px}
    .seg button.active{background:var(--ac-red);color:#fff}

    .kv{display:grid;grid-template-columns:120px 1fr;gap:8px 10px;font-size:13px;margin-top:10px}
    .k{color:var(--muted)}
    .v{font-weight:700}
    .gate{color:var(--ac-red)}

    .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
    .b-ok{background:#e8f7ec;color:#1b5e28}
    .b-warn{background:#fff8e6;color:#7a5a00}
    .b-bad{background:#fdecea;color:#8a1c15}
    .b-neu{background:#f3f4f6;color:#4b5563}

    .mapBox{background:var(--card2);border:1px solid var(--line);border-radius:16px;overflow:hidden}
    .mapTop{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);gap:10px;background:var(--card)}
    .mapTitle{font-size:13px;font-weight:900}
    .map{height:360px;}
    #osmMap{height:360px;}

    .btnRow{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
    .btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
    .btn.primary{background:var(--ac-red);border-color:var(--ac-red);color:#fff}
    .err{margin-top:10px;color:#a30d25;font-size:12px;white-space:pre-wrap}

    .muted{color:var(--muted)}
    .small{font-size:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="page-header">
      <img class="brand-logo" src="/airchina-logo.png" alt="Air China" />
      <div class="page-header-main">
        <div class="title" id="hdrTitle">航班信息</div>
        <div class="sub" id="hdrSub">—</div>
      </div>
      <div class="pill" id="whoPill">—</div>
    </header>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <div class="seg" id="legSeg"></div>
      </div>

      <div class="grid" style="margin-top:12px">
        <div class="card" style="background:transparent;border:none;padding:0">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
            <div class="badge b-neu" id="statusBadge">SCHEDULED</div>
            <div class="small muted" id="updatedTxt">—</div>
          </div>

          <div class="kv" id="kv"></div>

          <div class="btnRow">
            <button class="btn" id="backBtn" type="button">返回修改</button>
            <button class="btn primary" id="navBtn" type="button">开始导航</button>
          </div>

          <div class="err" id="err"></div>
        </div>

        <div class="mapBox">
          <div class="mapTop">
            <div>
              <div class="mapTitle" id="mapTitle">地图</div>
              <div class="small muted" id="mapDesc">—</div>
            </div>
          </div>
          <div id="osmMap" class="map"></div>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  const qs = (k) => new URL(location.href).searchParams.get(k);
  const rawPid = qs('pid') || qs('pax') || 'TX1';
  const pid = (rawPid || '').trim();
  const tenant = qs('tenant') || 'airchina';
  const isP8 = String(pid || '').toUpperCase() === 'P8';
  const plan = isP8 ? 'premium' : (qs('plan') || 'free');
  const name = qs('name') || (isP8 ? 'YAN JIANG' : (plan === 'premium' ? 'SIYAO FU' : 'Guest'));
  const intent = (qs('intent') || '').toLowerCase();
  const flight = (qs('flight') || '').trim();
  const arrFlight = (qs('arr') || '').trim();
  const depFlight = (qs('dep') || '').trim();

  const elTitle = document.getElementById('hdrTitle');
  const elSub = document.getElementById('hdrSub');
  const whoPill = document.getElementById('whoPill');
  whoPill.textContent = `${name} (${pid}) · ${plan === 'premium' ? '💎 Premium' : 'Free'}`;

  const legSeg = document.getElementById('legSeg');
  const kv = document.getElementById('kv');
  const err = document.getElementById('err');
  const statusBadge = document.getElementById('statusBadge');
  const updatedTxt = document.getElementById('updatedTxt');
  const mapTitle = document.getElementById('mapTitle');
  const mapDesc = document.getElementById('mapDesc');

  let activeLeg = null; // 'dep' | 'arr' | 't1' | 't2'

  let osmMap = null;
  let osmLayer = null;
  let osmMarkers = [];

  function setError(msg){
    err.textContent = msg || '';
  }

  function setBadge(label, cls){
    statusBadge.textContent = label || '—';
    statusBadge.className = 'badge ' + (cls === 'ok' ? 'b-ok' : cls === 'warn' ? 'b-warn' : cls === 'bad' ? 'b-bad' : 'b-neu');
  }

  function mkKV(rows){
    kv.innerHTML = '';
    rows.forEach(([k,v,klass])=>{
      const dk = document.createElement('div'); dk.className='k'; dk.textContent=k;
      const dv = document.createElement('div'); dv.className='v' + (klass?(' '+klass):''); dv.textContent=v;
      kv.appendChild(dk); kv.appendChild(dv);
    });
  }

  function makeLegButtons(legs){
    legSeg.innerHTML = '';
    legs.forEach(({id,label})=>{
      const b = document.createElement('button');
      b.type='button'; b.textContent=label; b.dataset.leg=id;
      b.className = (activeLeg===id)?'active':'';
      b.addEventListener('click', ()=>{ activeLeg=id; updateLegUI(); });
      legSeg.appendChild(b);
    });
  }

  async function apiJson(url, opts){
    const r = await fetch(url, opts);
    const text = await r.text();
    if (!text || !text.trim()) {
      const msg = r.ok ? '服务器返回空内容。' : `请求失败 (${r.status})：后端可能未启动，请确认 port 8000 服务已运行。`;
      throw new Error(msg);
    }
    let j;
    try { j = JSON.parse(text); } catch (e) {
      throw new Error('服务器返回了无效的 JSON：' + (e?.message || String(e)));
    }
    return j;
  }

  function ensureOSMMap(){
    if (osmMap) return osmMap;
    osmMap = L.map('osmMap', { zoomControl: true });
    osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' });
    osmLayer.addTo(osmMap);
    return osmMap;
  }

  function clearOSM(){
    if (!osmMap) return;
    osmMarkers.forEach(m=>m.remove());
    osmMarkers = [];
  }

  async function drawOSM(airport, points){
    ensureOSMMap();
    clearOSM();

    let center = null;
    try{
      const a = await apiJson(`/api/airport?airport=${encodeURIComponent(airport)}`);
      if (a && a.ok && a.data && a.data.center) center = a.data.center;
    }catch{}

    const latlngs = [];
    for (const p of points){
      if (!p.gate) continue;
      let ll = center;
      try{
        const g = await apiJson(`/api/gate?airport=${encodeURIComponent(airport)}&gate=${encodeURIComponent(p.gate)}`);
        if (g && g.ok && g.data && g.data.center) ll = g.data.center;
      }catch{}
      if (!ll) continue;
      const m = L.marker([ll[0], ll[1]]).addTo(osmMap).bindPopup(`${airport} ${p.gate}`);
      osmMarkers.push(m);
      latlngs.push([ll[0], ll[1]]);
    }

    if (latlngs.length){
      const b = L.latLngBounds(latlngs);
      osmMap.fitBounds(b.pad(0.15));
    } else if (center) {
      osmMap.setView([center[0], center[1]], 14);
    }
  }

  // Data holders
  let single = null; // {instance, badge, ...}
  let transfer = null; // {arrival, departure, hub_airport, from_gate, to_gate, ...}
  /** PEK demo: CCA7206 + CCA5281 — 第二页硬编码；开始导航 gateFrom=E32 gateTo=E25（出发登机口）. */
  let useHard721Demo = false;
  /** E32→E25 步行：「中转到」与「中转从」共用同一组米/分钟（与下方 transfer 赋值一致）. */
  var HARD721_FULL_WALK_M = 480;
  var HARD721_FULL_WALK_MIN = 8;

  function norm(s){ return (s||'').toString().trim(); }

  function normalizeFlightInput(s){
    var t = String(s || '').trim().toUpperCase().replace(/\s+/g, '');
    if (t.indexOf('CCA') === 0) t = 'CA' + t.slice(3);
    return t;
  }

  function hardcodedTransfer7206_5281(arr, dep){
    return normalizeFlightInput(arr) === 'CA7206' && normalizeFlightInput(dep) === 'CA5281';
  }

  function updateLegUI(){
    // update leg buttons
    document.querySelectorAll('#legSeg button').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.leg === activeLeg);
    });

    if (intent === 'transfer'){
      if (!transfer) return;
      const hub = transfer.hub_airport;

      if (useHard721Demo){
        var arrShow = norm(arrFlight) || 'CCA7206';
        var depShow = norm(depFlight) || 'CCA5281';
        var hubDisp = 'PEK';
        var segWalk =
          transfer.walk_distance_m != null && transfer.walk_time_min != null
            ? '约 ' + Math.round(transfer.walk_distance_m) + ' m / ' + Math.round(transfer.walk_time_min) + ' min'
            : '—';
        if (activeLeg === 't1'){
          elTitle.textContent = '中转抵达 · ' + arrShow;
          elSub.textContent = arrShow + ' · 抵达 ' + hubDisp + '（T3E）';
          setBadge('ARRIVAL', 'ok');
          updatedTxt.textContent = transfer.provider ? 'Provider: ' + transfer.provider : '';
          mkKV([
            ['抵达机场', 'PEK'],
            ['抵达航站楼', 'T3E'],
            ['抵达登机口', 'E32', 'gate'],
            ['楼层', 'F3'],
            ['中转到', 'E32 → E25（' + segWalk + '）', ''],
          ]);
        } else {
          elTitle.textContent = '中转出发 · ' + depShow;
          elSub.textContent = depShow + ' · 自 ' + hubDisp + ' 出港';
          setBadge('DEPARTURE', 'ok');
          updatedTxt.textContent = transfer.provider ? 'Provider: ' + transfer.provider : '';
          mkKV([
            ['出发机场', 'PEK'],
            ['出发航站楼', 'T3E'],
            ['出发登机口', 'E25', 'gate'],
            ['楼层', 'F2'],
            ['中转从', 'E32 → E25（' + segWalk + '）', ''],
          ]);
        }
        mapTitle.textContent = '机场地图 · ' + hubDisp;
        mapDesc.textContent = '展示登机口：E32 与 E25';
        var pts = [
          { gate: 'E32', glyph: '1', color: '#34c759' },
          { gate: 'E25', glyph: '2', color: '#c8102e' },
        ];
        drawOSM(hubDisp, pts);
        return;
      }

      // Demo: fixed transfer gates per boarding-pass passenger mapping.
      const demoGateByPid = {
        TX1: { arr: 'E16', dep: 'E19' },
        TX2: { arr: 'E18', dep: 'E19' },
        TX3: { arr: 'E17', dep: 'E19' },
        P8: { arr: 'E32', dep: 'E25' },
      };
      const demoPair = demoGateByPid[pid] || { arr: 'E16', dep: 'E19' };
      const demoArrGate = demoPair.arr;
      const demoDepGate = demoPair.dep;
      const g1 = demoArrGate;
      const g2 = demoDepGate;

      const dist = transfer.walk_distance_m ? `${Math.round(transfer.walk_distance_m)} m` : '—';
      const tmin = transfer.walk_time_min ? `${Math.round(transfer.walk_time_min)} min` : '—';

      if (activeLeg === 't1'){
        elTitle.textContent = `中转抵达 · ${norm(arrFlight) || transfer.arrival.flight_iata}`;
        elSub.textContent = `${transfer.arrival.dep_iata} → ${transfer.arrival.arr_iata}`;
        setBadge('ARRIVAL', 'ok');
        updatedTxt.textContent = transfer.provider ? `Provider: ${transfer.provider}` : '';
        mkKV([
          ['抵达机场', transfer.arrival.arr_iata || '—'],
          ['抵达航站楼', transfer.arrival.arr_terminal || '—'],
          ['抵达登机口', demoArrGate, 'gate'],
          ['楼层', '—'],
          ['中转到', `${g1} → ${g2}（${dist} / ${tmin}）`, ''],
        ]);
      } else {
        elTitle.textContent = `中转出发 · ${norm(depFlight) || transfer.departure.flight_iata}`;
        elSub.textContent = `${transfer.departure.dep_iata} → ${transfer.departure.arr_iata}`;
        setBadge('DEPARTURE', 'ok');
        updatedTxt.textContent = transfer.provider ? `Provider: ${transfer.provider}` : '';
        mkKV([
          ['出发机场', transfer.departure.dep_iata || '—'],
          ['出发航站楼', transfer.departure.dep_terminal || '—'],
          ['出发登机口', demoDepGate, 'gate'],
          ['楼层', '—'],
          ['中转从', `${g1} → ${g2}（${dist} / ${tmin}）`, ''],
        ]);
      }

      mapTitle.textContent = `机场地图 · ${hub}`;
      mapDesc.textContent = `展示登机口：${g1} 和 ${g2}`;

      const points = [
        { gate: g1, glyph: '1', color: '#34c759' },
        { gate: g2, glyph: '2', color: '#c8102e' },
      ];

      drawOSM(hub, points);
      return;
    }

    // single flight
    if (!single) return;
    const inst = single.instance;

    const depGate = inst.dep_gate || '—';
    const arrGate = inst.arr_gate || '—';

    const leg = (activeLeg === 'arr') ? 'arr' : 'dep';
    const airport = (leg === 'dep') ? inst.dep_iata : inst.arr_iata;
    const gate = (leg === 'dep') ? depGate : arrGate;
    const terminal = (leg === 'dep') ? (inst.dep_terminal || '—') : (inst.arr_terminal || '—');

    elTitle.textContent = `${inst.flight_iata || norm(flight)}`;
    elSub.textContent = `${inst.dep_iata} → ${inst.arr_iata} · ${leg === 'dep' ? '出发' : '抵达'}页面`;

    setBadge(single.badge?.label || 'SCHEDULED', single.badge?.class || 'neutral');
    updatedTxt.textContent = `${single.updated || ''}`;

    mkKV([
      ['出发时间', inst.dep_time_local || '—'],
      ['抵达时间', inst.arr_time_local || '—'],
      ['出发航站楼', inst.dep_terminal || '—'],
      ['出发登机口', depGate, 'gate'],
      ['抵达航站楼', inst.arr_terminal || '—'],
      ['抵达登机口', arrGate, 'gate'],
    ]);

    mapTitle.textContent = `${leg === 'dep' ? '出发' : '抵达'}地图 · ${airport}`;
    mapDesc.textContent = `Terminal ${terminal} · Gate ${gate}`;

    const points = [{ gate: gate, glyph: '✈️', color: '#c8102e' }];
    drawOSM(airport, points);
  }

  async function load(){
    setError('');
    useHard721Demo = false;

    if (intent === 'transfer'){
      if (!arrFlight || !depFlight) {
        setError('中转模式需要提供 arr 与 dep 航班号。');
        return;
      }
      if (hardcodedTransfer7206_5281(arrFlight, depFlight)){
        useHard721Demo = true;
        transfer = {
          hub_airport: 'PEK',
          arrival: {
            flight_iata: normalizeFlightInput(arrFlight),
            dep_iata: '—',
            arr_iata: 'PEK',
            dep_terminal: '—',
            arr_terminal: 'T3E',
          },
          departure: {
            flight_iata: normalizeFlightInput(depFlight),
            dep_iata: 'PEK',
            arr_iata: '—',
            dep_terminal: 'T3E',
            arr_terminal: '—',
          },
          walk_distance_m: HARD721_FULL_WALK_M,
          walk_time_min: HARD721_FULL_WALK_MIN,
          provider: 'Demo',
        };
        activeLeg = 't1';
        makeLegButtons([
          { id: 't1', label: '抵达航班' },
          { id: 't2', label: '出发航班' },
        ]);
        updateLegUI();
        return;
      }
      elTitle.textContent = '中转航班查询…';
      elSub.textContent = `${arrFlight} / ${depFlight}`;

      try{
        const j = await apiJson('/api/transfer', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ arrFlight, depFlight })
        });
        if (!j || !j.ok) throw new Error(j?.message || j?.error || 'transfer failed');
        transfer = j.data;

        activeLeg = 't1';
        makeLegButtons([
          {id:'t1', label:'抵达航班'},
          {id:'t2', label:'出发航班'},
        ]);

        updateLegUI();
      }catch(e){
        // Demo fallback: keep 中转页可用 even when FlightAware is blocked/unavailable.
        // The QR demo codes always assume hub = PEK.
        const hub = 'PEK';
        const terminal = 'T3E';

        function inboundFrom(a){
          const x = String(a || '').trim().toUpperCase();
          if (x === 'CA836') return 'CDG';
          if (x === 'CA921') return 'SYD';
          if (x === 'CA783') return 'FRA';
          return '—';
        }

        function outboundTo(d){
          const x = String(d || '').trim().toUpperCase();
          if (x === 'CA783' || x === 'CA837' || x === 'CA903') return 'CDG';
          return '—';
        }

        const fromIata = inboundFrom(arrFlight);
        const toIata = outboundTo(depFlight);

        transfer = {
          arrival: {
            flight_iata: String(arrFlight || '').toUpperCase(),
            dep_iata: fromIata,
            arr_iata: hub,
            dep_terminal: '—',
            arr_terminal: terminal,
          },
          departure: {
            flight_iata: String(depFlight || '').toUpperCase(),
            dep_iata: hub,
            arr_iata: toIata,
            dep_terminal: terminal,
            arr_terminal: '—',
          },
          hub_airport: hub,
          from_gate: 'E16',
          to_gate: 'E19',
          walk_distance_m: 320,
          walk_time_min: 5,
          provider: 'Demo',
        };

        activeLeg = 't1';
        makeLegButtons([
          {id:'t1', label:'抵达航班'},
          {id:'t2', label:'出发航班'},
        ]);
        updateLegUI();
      }
      return;
    }

    // depart/arrive
    if (!flight){
      setError('请提供 flight 参数。');
      return;
    }

    elTitle.textContent = '航班查询…';
    elSub.textContent = flight;

    try{
      const j = await apiJson(`/api/flight/closest?q=${encodeURIComponent(flight)}`);
      if (!j || !j.ok) throw new Error(j?.message || j?.error || 'flight lookup failed');
      single = j.data;

      activeLeg = (intent === 'arrive') ? 'arr' : 'dep';
      makeLegButtons([
        {id:'dep', label:'出发页'},
        {id:'arr', label:'抵达页'},
      ]);

      updateLegUI();
    }catch(e){
      setError('FlightAware 查询失败：\n' + (e?.message || String(e)));
    }
  }

  // buttons
  document.getElementById('backBtn').addEventListener('click', ()=>{
    const back = new URL('/pax', location.origin);
    back.searchParams.set('tenant', tenant);
    back.searchParams.set('pid', rawPid);
    location.href = back.pathname + '?' + back.searchParams.toString();
  });

  function gatesForRouteVideo(){
    if (intent === 'transfer' && useHard721Demo) {
      return { fromGate: 'E32', toGate: 'E25' };
    }
    const demoGateByPid = {
      TX1: { fromGate: 'E16', toGate: 'E19' },
      TX2: { fromGate: 'E18', toGate: 'E19' },
      TX3: { fromGate: 'E17', toGate: 'E19' },
      P8: { fromGate: 'E32', toGate: 'E25' },
    };
    const demoPair = demoGateByPid[String(pid || '').toUpperCase()];
    if (intent === 'transfer'){
      if (demoPair) return demoPair;
      return { fromGate: 'E16', toGate: 'E19' };
    }
    if (single && single.instance){
      const inst = single.instance;
      const a = norm(inst.arr_gate);
      const d = norm(inst.dep_gate);
      return { fromGate: a || '', toGate: d || '' };
    }
    return { fromGate: '', toGate: '' };
  }

  function buildPaxHtmlHref(){
    const u = new URL('/pax.html', location.origin);
    u.searchParams.set('tenant', tenant);
    u.searchParams.set('pax', pid);
    u.searchParams.set('plan', plan);
    u.searchParams.set('name', name);
    if (intent === 'transfer'){
      u.searchParams.set('arr', arrFlight);
      u.searchParams.set('dep', depFlight);
    }
    if (String(pid || '').toUpperCase() === 'P11') {
      u.searchParams.set('fromFlight', '1');
    }
    const g = gatesForRouteVideo();
    if (g.fromGate) u.searchParams.set('gateFrom', g.fromGate);
    if (g.toGate) u.searchParams.set('gateTo', g.toGate);
    // 室内图：航站楼 / 楼层（与 airport-map 下拉 L3=抵达层 等一致），供 POI 连线规划步行路径
    if (useHard721Demo) {
      u.searchParams.set('navTerminal', 'T3E');
      // L3≈抵达层(E32)、L2≈出发层(E25)；多楼层合并 POI 图才能连电梯/扶梯边
      u.searchParams.set('navFloors', 'L3,L2');
    }
    // Open 视频页 immediately so route_site loads & syncs TX* position to back office
    u.searchParams.set('view', 'video');
    if (intent === 'transfer' && transfer && transfer.hub_airport) {
      u.searchParams.set('hub', String(transfer.hub_airport).toUpperCase());
    } else if (single && single.instance) {
      const inst = single.instance;
      const hx = inst.arr_iata || inst.dep_iata;
      if (hx) u.searchParams.set('hub', String(hx).toUpperCase());
    }
    const rs = (qs('routeSite') || '').trim();
    const rm = (qs('routeMap') || '').trim();
    if (rs) u.searchParams.set('routeSite', rs);
    else if (rm) u.searchParams.set('routeMap', rm);
    const spIn = new URL(location.href).searchParams;
    const dbg = String(spIn.get('orientaDebug') || spIn.get('debug') || '').trim();
    if (/^(1|true|yes)$/i.test(dbg)) u.searchParams.set('orientaDebug', '1');
    return u.pathname + '?' + u.searchParams.toString();
  }

  document.getElementById('navBtn').addEventListener('click', ()=>{
    location.href = buildPaxHtmlHref();
  });

  // init
  load();
})();
</script>
</body>
