<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="/manifest.webmanifest" />
<title>Air China · 消息</title>
<style>
  /* Air China portal–style: light gray field + 国航红 (cf. airchina.com) */
  :root {
    --ac-red: #c8102e;
    --ac-red-dark: #a30d25;
    --page: linear-gradient(180deg, #f7f8fb 0%, #eceff4 50%, #e2e6ed 100%);
    --surface: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --line: #dce0e6;
    --browser-ui-bottom-inset: 0px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; height: -webkit-fill-available; }
  html, body { height: 100%; max-height: 100dvh; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: system-ui, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    background: var(--page);
    border-top: 4px solid var(--ac-red);
    min-height: 100%;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (max-width: 520px), (max-height: 720px) {
    .view-tabs { padding: 6px 10px; gap: 6px; }
    .view-tab { padding: 8px 10px; font-size: 13px; }
    .panel-video .video-hint { padding: 6px 12px; font-size: 10px; line-height: 1.35; }
  }
  .view-tabs { display: flex; gap: 8px; padding: 10px 16px; background: rgba(255,255,255,0.65); border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .view-tab {
    flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .view-tab.active { background: var(--ac-red); color: #fff; border-color: var(--ac-red-dark); }
  .panel-chat { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .panel-video { flex: 1; min-height: 0; display: none; flex-direction: column; overflow: hidden; background: #eef0f4; }
  .video-hint { flex-shrink: 0; padding: 10px 16px; font-size: 11px; color: var(--muted); line-height: 1.45; border-bottom: 1px solid var(--line); background: var(--surface); }
  .video-top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .route-video-line { color: var(--text); font-weight: 700; margin: 0; }
  .video-frame-wrap {
    flex: 1;
    min-height: 0;
    position: relative;
    box-sizing: border-box;
    padding-bottom: var(--browser-ui-bottom-inset, 0px);
  }
  .video-frame-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #111; }
  .hdr { padding: 12px 16px 10px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .hdr-title { font-size: 17px; font-weight: 700; }
  .hdr-sub { font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c4c8ce; flex-shrink: 0; }
  .dot.online { background: #2e9d4f; }
  .info-strip { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; gap: 16px; flex-wrap: wrap; }
  .info-item { font-size: 12px; }
  .info-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .info-val { font-weight: 600; margin-top: 1px; }
  .gate-val { color: var(--ac-red); font-size: 16px; font-weight: 800; }
  .msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { display: flex; flex-direction: column; }
  .msg.right { align-items: flex-end; }
  .msg.left  { align-items: flex-start; }
  .msg-meta { font-size: 10px; color: #8b919c; margin-bottom: 2px; }
  .bubble { max-width: 78%; padding: 8px 12px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-break: break-word; }
  .bubble.pax    { background: var(--ac-red); color: #fff; border-bottom-right-radius: 4px; }
  .bubble.admin  { background: #e8eaef; color: var(--text); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bubble.agent  { background: #f0f4fa; color: #1e3a5f; border: 1px solid #c5d4e8; border-bottom-left-radius: 4px; }
  .bubble.system { background: #fff8e6; color: #8a5b00; font-style: italic; border-radius: 8px; border: 1px solid #f0e0b2; }
  .input-area { padding: 10px 16px 20px; background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .input-area textarea { flex: 1; background: #f3f4f6; border: 1px solid var(--line); border-radius: 20px; color: var(--text); font-size: 15px; padding: 8px 14px; resize: none; height: 40px; line-height: 1.4; }
  .btn-send { background: var(--ac-red); color: #fff; border: none; border-radius: 20px; padding: 0 18px; font-size: 15px; font-weight: 600; cursor: pointer; height: 40px; white-space: nowrap; }
  .btn-send:disabled { opacity: 0.4; }
  .notify-banner { margin: 8px 16px; padding: 10px 14px; background: #fff5f5; border: 1px solid rgba(200,16,46,0.22); border-radius: 10px; font-size: 13px; color: #4a1518; }
  .notify-banner .dismiss { float: right; cursor: pointer; opacity: 0.6; font-size: 16px; margin-left: 8px; }
  .status-row { padding: 0 16px 6px; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); background: transparent; }
  .loc-btn { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .mode-warn { margin: 8px 16px 0; padding: 10px 12px; border-radius: 10px; background: #fff2f2; color: #8a1024; border: 1px solid rgba(200,16,46,0.35); font-size: 12px; font-weight: 700; line-height: 1.45; display: none; }
  .push-wrap { margin: 0; padding: 0; border: 0; background: transparent; display: none; }
  .push-btn { appearance: none; border: 1px solid rgba(200,16,46,0.35); background: #fff; color: #8a1024; border-radius: 10px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .push-hint { display: none; }
</style>
</head>
<body>

<div class="view-tabs" role="tablist" aria-label="主视图">
  <button type="button" class="view-tab active" id="tabChat" role="tab" aria-selected="true" aria-controls="panelChat">通信</button>
  <button type="button" class="view-tab" id="tabVideo" role="tab" aria-selected="false" aria-controls="panelVideo">导航页</button>
</div>
<div id="panelChat" class="panel-chat">
<div class="hdr">
  <div class="dot" id="connDot" title="连接状态"></div>
  <div>
    <div class="hdr-title" id="paxName">Loading…</div>
    <div class="hdr-sub" id="paxSub"></div>
  </div>
</div>

<div class="info-strip" id="infoStrip" style="display:none">
  <div class="info-item">
    <div class="info-label">Inbound</div>
    <div class="info-val" id="infoInbound">—</div>
  </div>
  <div class="info-item">
    <div class="info-label">Outbound</div>
    <div class="info-val" id="infoOutbound">—</div>
  </div>
  <div class="info-item">
    <div class="info-label">Gate</div>
    <div class="gate-val" id="infoGate">—</div>
  </div>
  <div class="info-item">
    <div class="info-label">Status</div>
    <div class="info-val" id="infoStatus">—</div>
  </div>
</div>

<div id="notifyBanners"></div>

<div class="msgs" id="msgs">
  <div style="text-align:center;color:#6b7280;font-size:13px;margin-top:20px">
    Air China 智能中转 · Orienta Transfer Assist<br>
    <span id="premiumNote" style="font-size:11px;margin-top:4px;display:block"></span>
  </div>
</div>

<div class="status-row">
  <span id="locStatus">导航推算位置（非 GPS）：—</span>
  <button class="loc-btn" id="locBtn" onclick="shareLocation()">📍 Share Location</button>
</div>

<div class="input-area" id="inputArea" style="display:none">
  <textarea id="msgInput" placeholder="Type a message…" rows="1"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
  <button class="btn-send" id="sendBtn" type="button" onclick="sendMsg()">Send</button>
</div>
</div>

<div id="panelVideo" class="panel-video" role="tabpanel" aria-labelledby="tabVideo">
  <div class="video-hint" id="videoHintTop">
    <div class="video-top-row">
      <div id="routeVideoLine" class="route-video-line" style="display:none;font-size:13px"></div>
      <div id="pushWrap" class="push-wrap">
        <button id="pushBtn" class="push-btn" type="button">开启手机通知</button>
        <div id="pushHint" class="push-hint"></div>
      </div>
    </div>
    <span id="videoHintBody"></span>
  </div>
  <div class="video-frame-wrap">
    <iframe
      title="室内路线视频"
      id="routeSiteFrame"
      src="about:blank"
      allow="accelerometer; gyroscope; magnetometer; clipboard-read; clipboard-write"
    ></iframe>
  </div>
</div>

<script src="/orienta-metrics.js"></script>
<script>
const params = new URLSearchParams(location.search);
try {
  window.__ORIENTA_NAV_PATH_STEPS__ = [];
  window.__ORIENTA_NAV_PATH_WAYPOINTS_ONLY__ = [];
} catch (eNavInit) {}
const tenantId   = params.get("tenant") || "airchina";
const passengerId =
  (params.get("pax") || params.get("pid") || params.get("pix") || "").trim();
const hubFromQuery = (params.get("hub") || params.get("airport") || "").trim().toUpperCase();
/** 与 pax-flight 抵达/出发机场一致：默认国航租户走 PEK 室内资源 */
const routeSiteAirport = hubFromQuery || "PEK";
const isStandalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || !!navigator.standalone;

function isPushSupported() {
  return ("serviceWorker" in navigator) && ("PushManager" in window) && ("Notification" in window);
}

function b64ToU8(base64) {
  var pad = "=".repeat((4 - (base64.length % 4)) % 4);
  var b64 = (base64 + pad).replace(/-/g, "+").replace(/_/g, "/");
  var raw = atob(b64);
  var out = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

(function orientaPaxPageDebugBootstrap_() {
  const od = String(params.get("orientaDebug") || params.get("debug") || "").trim();
  if (!/^(1|true|yes)$/i.test(od)) return;
  var orientaAppendDebugLine_ = null;
  function ensure() {
    if (orientaAppendDebugLine_) return;
    if (!document.getElementById("orienta-debug-scrollbar-style")) {
      var st = document.createElement("style");
      st.id = "orienta-debug-scrollbar-style";
      st.textContent =
        "#debug>.orienta-debug-scroll{scrollbar-width:none;-ms-overflow-style:none}" +
        "#debug>.orienta-debug-scroll::-webkit-scrollbar{width:0;height:0}";
      document.head.appendChild(st);
    }
    var el = document.createElement("div");
    el.id = "debug";
    el.setAttribute(
      "style",
      "position:fixed;left:0;right:0;top:0;bottom:auto;max-height:32vh;z-index:2147483647;display:flex;flex-flow:row nowrap;align-items:stretch;box-sizing:border-box;background:rgba(26,26,28,.96);color:#f3f4f6;font:11px/1.35 ui-monospace,monospace;border-bottom:2px solid #c8102e;word-break:break-word;"
    );
    var scrollInner = document.createElement("div");
    scrollInner.className = "orienta-debug-scroll";
    scrollInner.setAttribute(
      "style",
      "flex:1 1 auto;min-width:0;min-height:0;max-height:32vh;overflow-x:hidden;overflow-y:scroll;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:max(8px,env(safe-area-inset-top,0px)) 4px 8px 8px;"
    );
    var rail = document.createElement("div");
    rail.setAttribute("title", "Scroll debug log");
    rail.setAttribute(
      "style",
      "width:22px;flex-shrink:0;min-height:0;align-self:stretch;background:linear-gradient(90deg,#0b1220,#1e293b);border-left:1px solid #64748b;position:relative;touch-action:none;-webkit-tap-highlight-color:transparent;"
    );
    var thumb = document.createElement("div");
    thumb.setAttribute(
      "style",
      "position:absolute;left:5px;width:11px;border-radius:6px;background:#e2e8f0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);top:6px;height:36px;touch-action:none;"
    );
    rail.appendChild(thumb);
    el.appendChild(scrollInner);
    el.appendChild(rail);
    function orientaDebugSyncRail_() {
      var sh = scrollInner.scrollHeight;
      var ch = scrollInner.clientHeight;
      var rh = rail.clientHeight || ch;
      if (sh <= ch + 2) {
        thumb.style.height = Math.max(28, rh - 12) + "px";
        thumb.style.top = "6px";
        thumb.style.opacity = "0.4";
        return;
      }
      thumb.style.opacity = "0.95";
      var th = Math.max(32, Math.floor((ch / sh) * rh));
      th = Math.min(th, rh - 12);
      var maxTop = Math.max(0, rh - th - 8);
      var p = scrollInner.scrollTop / Math.max(1, sh - ch);
      thumb.style.height = th + "px";
      thumb.style.top = (6 + p * maxTop) + "px";
    }
    scrollInner.addEventListener("scroll", orientaDebugSyncRail_, { passive: true });
    if (typeof ResizeObserver !== "undefined") {
      try {
        new ResizeObserver(orientaDebugSyncRail_).observe(scrollInner);
      } catch (eRo) {}
    }
    var railDragY = null;
    function orientaDbgTouchY_(ev) {
      return ev.touches && ev.touches[0] ? ev.touches[0].clientY : 0;
    }
    thumb.addEventListener(
      "touchstart",
      function (ev) {
        railDragY = orientaDbgTouchY_(ev);
        ev.stopPropagation();
      },
      { passive: true }
    );
    thumb.addEventListener(
      "touchmove",
      function (ev) {
        if (railDragY == null) return;
        var sh = scrollInner.scrollHeight;
        var ch = scrollInner.clientHeight;
        if (sh <= ch + 2) return;
        var y = orientaDbgTouchY_(ev);
        var dy = y - railDragY;
        railDragY = y;
        var rh = rail.clientHeight;
        var th = thumb.offsetHeight || 36;
        var maxTop = Math.max(1, rh - th - 8);
        var maxScroll = Math.max(1, sh - ch);
        scrollInner.scrollTop = Math.max(0, Math.min(maxScroll - 1e-6, scrollInner.scrollTop + (dy / maxTop) * maxScroll));
        orientaDebugSyncRail_();
        ev.preventDefault();
        ev.stopPropagation();
      },
      { passive: false }
    );
    thumb.addEventListener("touchend", function () {
      railDragY = null;
    });
    rail.addEventListener(
      "touchstart",
      function (ev) {
        if (ev.target === thumb) return;
        var sh = scrollInner.scrollHeight;
        var ch = scrollInner.clientHeight;
        if (sh <= ch + 2) return;
        var rect = rail.getBoundingClientRect();
        var y = orientaDbgTouchY_(ev) - rect.top;
        var frac = Math.max(0, Math.min(1, y / rect.height));
        scrollInner.scrollTop = frac * (sh - ch);
        orientaDebugSyncRail_();
        ev.stopPropagation();
      },
      { passive: true }
    );
    document.body.appendChild(el);
    try {
      document.documentElement.style.overscrollBehavior = "none";
    } catch (eOs) {}
    requestAnimationFrame(orientaDebugSyncRail_);
    var dbgScrollLastY = null;
    scrollInner.addEventListener(
      "touchstart",
      function (ev) {
        dbgScrollLastY = orientaDbgTouchY_(ev);
        ev.stopPropagation();
      },
      { passive: true }
    );
    scrollInner.addEventListener(
      "touchmove",
      function (ev) {
        var y = orientaDbgTouchY_(ev);
        var dy = dbgScrollLastY != null ? y - dbgScrollLastY : 0;
        dbgScrollLastY = y;
        var sh = scrollInner.scrollHeight;
        var ch = scrollInner.clientHeight;
        if (scrollInner.scrollTop <= 0 && dy > 0) ev.preventDefault();
        if (sh > ch + 2 && scrollInner.scrollTop >= sh - ch - 2 && dy < 0) ev.preventDefault();
        if (sh > ch + 2) ev.stopPropagation();
      },
      { passive: false }
    );
    scrollInner.addEventListener(
      "touchend",
      function () {
        dbgScrollLastY = null;
      },
      { passive: true }
    );
    orientaAppendDebugLine_ = function (msg, bad) {
      var t = document.createElement("div");
      t.style.cssText = "margin-top:6px;padding-top:6px;border-top:1px solid #444;color:" + (bad ? "#fca5a5" : "#e5e7eb");
      t.textContent = "[" + new Date().toISOString().slice(11, 23) + "] " + msg;
      scrollInner.appendChild(t);
      scrollInner.scrollTop = scrollInner.scrollHeight;
      requestAnimationFrame(orientaDebugSyncRail_);
    };
    orientaAppendDebugLine_("pax.html orientaDebug · tenant=" + tenantId + " pax=" + passengerId + " · " + String(location.href).slice(0, 180), false);
    window.addEventListener("error", function (ev) {
      orientaAppendDebugLine_(
        "window.error: " + (ev && ev.message ? ev.message : String(ev)) +
          " @" + (ev.filename || "") + ":" + (ev.lineno || "") + ":" + (ev.colno || ""),
        true
      );
    });
    window.addEventListener("unhandledrejection", function (ev) {
      var r = ev.reason;
      orientaAppendDebugLine_("unhandledrejection: " + (r && r.stack ? r.stack : String(r)), true);
    });
    var _nf = window.fetch;
    window.fetch = function (input, init) {
      var url = "";
      try {
        url = typeof input === "string" ? input : (input && input.url) ? String(input.url) : String(input);
      } catch (eu) {
        url = "(url)";
      }
      return _nf.apply(this, arguments).then(
        function (res) {
          if (!res.ok) orientaAppendDebugLine_("fetch HTTP " + res.status + " " + res.statusText + " " + url, true);
          return res;
        },
        function (err) {
          orientaAppendDebugLine_("fetch failed: " + url + " -> " + (err && err.message ? err.message : String(err)), true);
          throw err;
        }
      );
    };
  }
  window.orientaPaxDbg_ = function (msg, bad) {
    ensure();
    if (orientaAppendDebugLine_) orientaAppendDebugLine_(String(msg), !!bad);
  };
  ensure();
})();

const gateFromNav = (params.get("gateFrom") || "").trim();
const gateToNav = (params.get("gateTo") || "").trim();
const demoGateByPassenger = {
  TX1: { from: "E16", to: "E19" },
  TX2: { from: "E18", to: "E19" },
  TX3: { from: "E17", to: "E19" },
  /** 与 pax-flight 硬编码中转演示（CA7206+CA5281）及 PAX_DATA P8 一致：F3 抵达 E32 → F2 出发 E25 */
  P8: { from: "E32", to: "E25" },
};
const demoPair = demoGateByPassenger[String(passengerId || "").toUpperCase()];
/** PEK 室内视频 + PDR：无 URL gate 时也要给 route_site 一对默认门，否则 orientaPdrResolveAnchor 无起点。 */
const PEK_DEFAULT_ROUTE_GATES = { from: "E16", to: "E19" };
const effectiveGateFrom = demoPair
  ? demoPair.from
  : gateFromNav || (routeSiteAirport === "PEK" ? PEK_DEFAULT_ROUTE_GATES.from : "");
const effectiveGateTo = demoPair
  ? demoPair.to
  : gateToNav || (routeSiteAirport === "PEK" ? PEK_DEFAULT_ROUTE_GATES.to : "");
(function initRouteVideoLine() {
  const el = document.getElementById("routeVideoLine");
  if (!el) return;
  if (effectiveGateFrom && effectiveGateTo) {
    el.textContent = "抵达登机口 " + effectiveGateFrom + " → 出发登机口 " + effectiveGateTo;
    el.style.display = "block";
  }
})();

/** Set in initRouteSiteFrame — used for postMessage target/origin checks when 视频页 uses an external map URL. */
let routeIframeFullSrc = "";

function applyRouteIframeCommonParams(u) {
  u.searchParams.set("airport", routeSiteAirport);
  u.searchParams.set("tenant", tenantId);
  u.searchParams.set("pax", passengerId);
  if (effectiveGateFrom && effectiveGateTo) {
    u.searchParams.set("gateFrom", effectiveGateFrom);
    u.searchParams.set("gateTo", effectiveGateTo);
  }
  const autoGate = (params.get("autoGate") || "").toString().trim();
  if (autoGate === "1") {
    u.searchParams.set("autoGate", "1");
  }
  const pdrLat = params.get("pdrOriginLat") || params.get("pdrLat");
  const pdrLng = params.get("pdrOriginLng") || params.get("pdrLng");
  if (pdrLat && pdrLng) {
    u.searchParams.set("pdrOriginLat", String(pdrLat));
    u.searchParams.set("pdrOriginLng", String(pdrLng));
  }
  const pdrOnMap = (params.get("pdrOnMap") || params.get("pdrMap") || "").trim();
  if (pdrOnMap) u.searchParams.set("pdrOnMap", pdrOnMap);
  const pdrMapMatch = (params.get("pdrMapMatch") || "").trim();
  if (pdrMapMatch) u.searchParams.set("pdrMapMatch", pdrMapMatch);
  const pdrBackend = (params.get("pdrBackend") || "").trim();
  if (pdrBackend) u.searchParams.set("pdrBackend", pdrBackend);
  const indoorMapUrl = (params.get("indoorMapUrl") || params.get("orientaIndoorMapUrl") || "").trim();
  if (indoorMapUrl) u.searchParams.set("indoorMapUrl", indoorMapUrl);
  const indoorMapApi = (params.get("indoorMapApi") || "").trim();
  if (indoorMapApi) u.searchParams.set("indoorMapApi", indoorMapApi);
  const indoorTileBase = (params.get("indoorTileBase") || "").trim();
  if (indoorTileBase) u.searchParams.set("indoorTileBase", indoorTileBase);
  const indoorTileUrl = (params.get("indoorTileUrl") || "").trim();
  if (indoorTileUrl) u.searchParams.set("indoorTileUrl", indoorTileUrl);
  const orientaDbg = (params.get("orientaDebug") || params.get("debug") || "").trim();
  if (/^(1|true|yes)$/i.test(orientaDbg)) u.searchParams.set("orientaDebug", "1");
  const npl = (params.get("orientaNavPathLog") || params.get("navPathLog") || "").trim();
  if (/^(1|true|yes)$/i.test(npl)) u.searchParams.set("orientaNavPathLog", "1");
  const mpl = (
    params.get("orientaMapPosLog") ||
    params.get("orientaTouristDebug") ||
    params.get("touristPosLog") ||
    ""
  ).trim();
  if (/^(1|true|yes)$/i.test(mpl)) u.searchParams.set("orientaMapPosLog", "1");
  const navTerminal = (params.get("navTerminal") || "").trim();
  if (navTerminal) u.searchParams.set("navTerminal", navTerminal);
  const navFloors = (params.get("navFloors") || params.get("navFloor") || "").trim();
  if (navFloors) u.searchParams.set("navFloors", navFloors);
}

/** Cross-origin `airport-map.html` needs `parentOrigin` + `mapRole=passenger` for trajectory postMessage. */
function maybeAppendAirportMapPassengerParams(u) {
  try {
    if (!/airport-map\.html/i.test(u.pathname)) return;
  } catch (e) {
    return;
  }
  u.searchParams.set("mapRole", "passenger");
  u.searchParams.set("parentOrigin", location.origin);
}

function buildRouteSiteIframeSrc() {
  const override = (params.get("routeSite") || params.get("routeMap") || "").trim();
  let u;
  try {
    u = override
      ? new URL(override, location.href)
      : new URL("/route_site/index.html", location.href);
  } catch (e) {
    u = new URL("/route_site/index.html", location.href);
  }
  applyRouteIframeCommonParams(u);
  maybeAppendAirportMapPassengerParams(u);
  return u.toString();
}

function routeIframePostMessageTargetOrigin() {
  try {
    return new URL(routeIframeFullSrc || "/route_site/index.html", location.href).origin;
  } catch (e) {
    return location.origin;
  }
}

function isAllowedTrajectoryMessageOrigin(origin) {
  if (origin === location.origin) return true;
  try {
    return origin === new URL(routeIframeFullSrc || "/route_site/index.html", location.href).origin;
  } catch (e) {
    return false;
  }
}

function pingRouteSiteTouristPush() {

/** Top console on `/pax` is not `route_site`; delegate into #routeSiteFrame. */
function orientaCallRouteSiteTouristFn_(name) {
  var f = document.getElementById("routeSiteFrame");
  if (!f || !f.contentWindow) {
    return { error: "routeSiteFrame missing or not loaded yet" };
  }
  try {
    var inner = f.contentWindow;
    var fn = inner[name];
    if (typeof fn === "function") return fn.apply(inner, [].slice.call(arguments, 1));
    return { error: "route_site has no " + name + " (iframe still loading or old build)" };
  } catch (e) {
    return { error: e && e.message ? String(e.message) : String(e) };
  }
}

/** iPhone Safari bottom URL bar overlaps iframe controls — lift content via visualViewport inset. */
function orientaUpdateMobileBrowserChromeInset_() {
  var vv = window.visualViewport;
  var inset = 0;
  if (vv) {
    inset = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
  }
  document.documentElement.style.setProperty("--browser-ui-bottom-inset", inset + "px");
  var frame = document.getElementById("routeSiteFrame");
  if (frame && frame.contentWindow) {
    try {
      frame.contentWindow.postMessage({ type: "orienta-browser-ui-inset", bottomPx: inset }, "*");
    } catch (ePost) {}
  }
}

(function orientaMobileBrowserChromeInsetInit_() {

// ─── WebSocket ─────────────────────────────────────────────────
let ws = null;
var __orientaPaxChatPending_ = {};
var __orientaWsConnectMark_ = null;
let reconnTimer = null;
var orientaLastTrajRelayMs_ = 0;
var orientaRoutePullTimer_ = null;
var orientaLastKnownPos_ = null;
var ORIENTA_PAX_TRAJ_RELAY_MIN_MS = 250;
var ORIENTA_PAX_TRAJ_PULL_INTERVAL_MS = 300;

// route_site / external map iframe → live map on back office (same channel as spawn pax_trajectory)
window.addEventListener("message", function (ev) {
  const routeFrame = document.getElementById("routeSiteFrame");
  const d = ev.data;
  if (
    routeFrame &&
    ev.source === routeFrame.contentWindow &&
    d &&
    d.type === "orienta-nav-path-debug" &&
    isAllowedTrajectoryMessageOrigin(ev.origin)
  ) {
    try {
      window.__ORIENTA_NAV_PATH_STEPS__ = Array.isArray(d.pathSteps) ? d.pathSteps : [];
      window.__ORIENTA_NAV_PATH_WAYPOINTS_ONLY__ = window.__ORIENTA_NAV_PATH_STEPS__.filter(function (x) {
        return x && x.category === "waypoint";
      });
      /** `/pax` React 外壳的控制台在顶层 window；把路径再发给 parent 以便在地址栏为 /pax 时也能调试 */
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(
          { type: "orienta-nav-path-debug", pathSteps: window.__ORIENTA_NAV_PATH_STEPS__ },
          location.origin
        );
      }
    } catch (eNav) {}
    return;
  }
  if (!isAllowedTrajectoryMessageOrigin(ev.origin)) return;
  if (!d || d.type !== "orienta-pax-trajectory") return;
  const sock = ws;
  if (!sock || sock.readyState !== WebSocket.OPEN) return;
  const pos = d.position;
  if (!pos || typeof pos.lat !== "number" || typeof pos.lng !== "number") return;
  let path = Array.isArray(d.path) ? d.path : [];
  if (!path.length) path = [{ lat: pos.lat, lng: pos.lng }];
  try {
    sock.send(JSON.stringify({
      type: "pax_trajectory",
      path: path,
      position: { lat: pos.lat, lng: pos.lng }
    }));
    orientaLastKnownPos_ = { lat: pos.lat, lng: pos.lng };
    orientaLastTrajRelayMs_ = Date.now();
  } catch (e) {}
});

function orientaTryPullTouristFromRouteFrame_() {
  const sock = ws;
  if (!sock || sock.readyState !== WebSocket.OPEN) return;
  const frame = document.getElementById("routeSiteFrame");
  if (!frame || !frame.contentWindow) return;
  if (Date.now() - orientaLastTrajRelayMs_ < ORIENTA_PAX_TRAJ_RELAY_MIN_MS) return;
  try {
    var w = frame.contentWindow;
    if (!w || typeof w.orientaDumpTouristPosition !== "function") {
      if (orientaLastKnownPos_) {
        sock.send(JSON.stringify({
          type: "pax_trajectory",
          path: [orientaLastKnownPos_],
          position: orientaLastKnownPos_
        }));
        orientaLastTrajRelayMs_ = Date.now();
      }
      return;
    }
    var pos = w.orientaDumpTouristPosition();
    if (!pos || typeof pos.lat !== "number" || typeof pos.lng !== "number") {
      if (orientaLastKnownPos_) {
        sock.send(JSON.stringify({
          type: "pax_trajectory",
          path: [orientaLastKnownPos_],
          position: orientaLastKnownPos_
        }));
        orientaLastTrajRelayMs_ = Date.now();
      }
      return;
    }
    var hist = null;
    if (typeof w.orientaGetTouristPositionHistory === "function") {
      try { hist = w.orientaGetTouristPositionHistory(); } catch (eH) {}
    }
    var path = [{ lat: pos.lat, lng: pos.lng }];
    if (Array.isArray(hist) && hist.length) {
      var tail = hist.slice(-40).filter(function (r) {
        return r && typeof r.lat === "number" && typeof r.lng === "number";
      });
      if (tail.length) path = tail.map(function (r) { return { lat: r.lat, lng: r.lng }; });
    }
    sock.send(JSON.stringify({
      type: "pax_trajectory",
      path: path,
      position: { lat: pos.lat, lng: pos.lng }
    }));
    orientaLastKnownPos_ = { lat: pos.lat, lng: pos.lng };
    orientaLastTrajRelayMs_ = Date.now();
  } catch (ePull) {}
}

function wsUrl() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  return `${proto}://${location.host}/ws`;
}

var orientaPresencePingTimer_ = null;
function orientaPingPresenceHttp_(online) {
  try {
    var body = JSON.stringify({ tenantId: tenantId, passengerId: passengerId, online: online !== false });
    if (navigator.sendBeacon) {
      navigator.sendBeacon("/api/pax/presence", new Blob([body], { type: "application/json" }));
      return;
    }
    fetch("/api/pax/presence", { method: "POST", headers: { "Content-Type": "application/json" }, body: body, keepalive: true }).catch(function () {});
  } catch (ePing) {}
}
function orientaStartPresenceHeartbeat_() {
  orientaPingPresenceHttp_(true);
  if (orientaPresencePingTimer_) clearInterval(orientaPresencePingTimer_);
  orientaPresencePingTimer_ = setInterval(function () { orientaPingPresenceHttp_(true); }, 12000);
}
function orientaStopPresenceHeartbeat_() {
  if (orientaPresencePingTimer_) {
    clearInterval(orientaPresencePingTimer_);
    orientaPresencePingTimer_ = null;
  }
}

var __orientaWsSendWarnLastMs = 0;
function orientaPeekWsBriefStatus_() {
  if (!ws) return "未连接";
  switch (ws.readyState) {
    case WebSocket.CONNECTING:
      return "连接中";
    case WebSocket.OPEN:
      return "已连接";
    case WebSocket.CLOSING:
      return "断开中";
    case WebSocket.CLOSED:
      return "已断开";
    default:
      return "未知状态";
  }
}

function refreshWsTransportUiState() {
  try {
    var ok = !!(ws && ws.readyState === WebSocket.OPEN);
    var sendBtn = document.getElementById("sendBtn");
    var dot = document.getElementById("connDot");
    if (sendBtn) {
      // Keep Send clickable: when WebSocket is blocked, /api/pax/chat-send HTTP fallback still works.
      sendBtn.disabled = false;
      sendBtn.title = ok ? "" : "WebSocket 未连接 — 发送将尝试 HTTP 退路（/api/pax/chat-send）";
    }
    if (dot) dot.title = ok ? "已与服务器建立实时信道" : "未建立实时信道（" + orientaPeekWsBriefStatus_() + "）— 聊天可经 HTTP 退路发送";
  } catch (eR) {}
}

function setOnline(up) {
  document.getElementById("connDot").className = "dot" + (up ? " online" : "");
  refreshWsTransportUiState();
}

function connect() {
  if (typeof OrientaMetrics !== "undefined") {
    __orientaWsConnectMark_ = OrientaMetrics.start("pax.ws.connect", "ws", { role: "pax" });
  }
  ws = new WebSocket(wsUrl());
  refreshWsTransportUiState();
  ws.onopen = () => {
    if (__orientaWsConnectMark_) {
      __orientaWsConnectMark_.end({ ok: true });
      __orientaWsConnectMark_ = null;
    }
    setOnline(true);
    orientaLastTrajRelayMs_ = 0;
    if (!orientaLastKnownPos_) orientaLastKnownPos_ = { lat: 40.0724, lng: 116.6142 };
    ws.send(JSON.stringify({
      type: "hello", role: "pax", tenantId, passengerId,
      displayName: info.name, name: info.name, plan: info.plan,
      // Registry fields — server creates/updates passenger record from these
      flightId:        (params.get("dep") || params.get("departure") || params.get("departureFlight") || "").trim() || undefined,
      gateId:          gateToNav || undefined,
      inboundFlightId: (params.get("arr") || params.get("arrival") || params.get("arrivalFlight") || "").trim() || undefined,
      locale:          (navigator.language || "").slice(0, 10) || undefined,
    }));
    orientaStartPresenceHeartbeat_();
    ws.send(JSON.stringify({ type: "chat_fetch", tenantId, passengerId }));

    if (orientaLastKnownPos_) {
      ws.send(JSON.stringify({
        type: "pax_trajectory",
        path: [orientaLastKnownPos_],
        position: orientaLastKnownPos_,
      }));
      orientaLastTrajRelayMs_ = Date.now();
    }

    // Optional: navigation request from /pax entry page
    const arr = params.get("arr") || params.get("arrival") || params.get("arrivalFlight");
    const dep = params.get("dep") || params.get("departure") || params.get("departureFlight");
    const q = params.get("q") || params.get("query");
    if (arr && dep) {
      ws.send(JSON.stringify({ type: "nav_request", tenantId, passengerId, kind: "transfer", arrivalFlight: arr, departureFlight: dep }));
    } else if (q) {
      ws.send(JSON.stringify({ type: "nav_request", tenantId, passengerId, kind: "nl", query: q }));
    }
    if (!orientaRoutePullTimer_) orientaRoutePullTimer_ = setInterval(orientaTryPullTouristFromRouteFrame_, ORIENTA_PAX_TRAJ_PULL_INTERVAL_MS);
    setTimeout(orientaTryPullTouristFromRouteFrame_, 250);
    refreshWsTransportUiState();
  };
  ws.onclose = () => {
    orientaStopPresenceHeartbeat_();
    setOnline(false);
    refreshWsTransportUiState();
    if (orientaRoutePullTimer_) {
      clearInterval(orientaRoutePullTimer_);
      orientaRoutePullTimer_ = null;
    }
    reconnTimer = setTimeout(connect, 1500);
  };
  ws.onerror = () => {
    if (typeof OrientaMetrics !== "undefined") {
      if (__orientaWsConnectMark_) {
        __orientaWsConnectMark_.end({ ok: false });
        __orientaWsConnectMark_ = null;
      } else {
        OrientaMetrics.emit({ name: "pax.ws.connect", category: "ws", role: "pax", ok: false });
      }
    }
    try {
      refreshWsTransportUiState();
    } catch (eWsErr) {}
  };
  ws.onmessage = (ev) => {
    const m = (() => { try { return JSON.parse(ev.data); } catch { return null; } })();
    if (!m) return;
    if (m.type === "chat_msg")     handleChatMsg(m.message, true);
    if (m.type === "chat_history") { clearMsgs(); m.messages.forEach(msg => handleChatMsg(msg, false)); }
    if (m.type === "message")      showNotify(m.record.body, m.record.messageId);
    if (m.type === "loc_request")  showLocRequest();
  };
}

// HTTP presence works when trycloudflare/cpolar drops WS hello or admin misses presence events.

connect();

// ─── Messages ─────────────────────────────────────────────────
const msgs = document.getElementById("msgs");

function clearMsgs() {
  msgs.innerHTML = "";
}

function handleChatMsg(msg, scroll) {
  if (typeof OrientaMetrics !== "undefined") {
    if (msg.from === "admin" || msg.from === "agent") {
      OrientaMetrics.emit({
        name: "pax.chat.receive",
        category: "chat",
        role: "pax",
        ok: true,
        props: { from: msg.from, kind: msg.kind },
      });
    }
    if (msg.from === "pax") {
      var pendingKey = String(msg.body || "").slice(0, 120);
      var sentAt = __orientaPaxChatPending_[pendingKey];
      if (sentAt) {
        OrientaMetrics.emit({
          name: "pax.chat.send",
          category: "chat",
          role: "pax",
          durationMs: Date.now() - sentAt,
          ok: true,
          props: { transport: "ws_echo" },
        });
        delete __orientaPaxChatPending_[pendingKey];
      }
    }
  }
  const isOwn = (msg.from === "pax");
  const side  = isOwn ? "right" : "left";
  const cls   = isOwn ? "pax" : msg.from; // admin / agent / system

  const div = document.createElement("div");
  div.className = `msg ${side}`;
  div.dataset.msgId = msg.id;

  const meta = document.createElement("div");
  meta.className = "msg-meta";
  const labels = { admin: "Operator", pax: "You", agent: "🤖 Orienta AI", system: "⚙️ System" };
  const t = new Date(msg.createdAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  meta.textContent = `${labels[msg.from] || msg.from} · ${t}`;

  const bubble = document.createElement("div");
  bubble.className = `bubble ${cls}`;
  bubble.textContent = msg.body;

  div.appendChild(meta);
  div.appendChild(bubble);
  msgs.appendChild(div);

  if (scroll) msgs.scrollTop = msgs.scrollHeight;

  // Send read receipt for operator messages
  if ((msg.from === "admin" || msg.from === "agent") && ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: "chat_read", tenantId, passengerId, messageId: msg.id, at: Date.now() }));
  }
}

function orientaTrySendChatHttp_(body, ta, kind) {
  var k = kind || "text";
  var url = new URL("/api/pax/chat-send", window.location.href);
  return fetch(url.toString(), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tenantId: tenantId, passengerId: passengerId, body: body, kind: k }),
  })
    .then(function (r) {
      return r.json().then(function (j) {
        return { r: r, j: j };
      });
    })
    .then(function (pair) {
      if (!pair.r.ok || !pair.j || !pair.j.ok || !pair.j.message) {
        throw new Error((pair.j && pair.j.error) || "chat_http_failed");
      }
      if (typeof OrientaMetrics !== "undefined") {
        var k = String(body || "").slice(0, 120);
        var sentAt = __orientaPaxChatPending_[k];
        if (sentAt) {
          OrientaMetrics.emit({
            name: "pax.chat.send",
            category: "chat",
            role: "pax",
            durationMs: Date.now() - sentAt,
            ok: true,
            props: { transport: "http" },
          });
          delete __orientaPaxChatPending_[k];
        }
      }
      handleChatMsg(pair.j.message, true);
      if (ta) ta.value = "";
      refreshWsTransportUiState();
    });
}

function sendMsg() {
  const ta = document.getElementById("msgInput");
  const body = ta.value.trim();
  if (!body) return;
  if (typeof OrientaMetrics !== "undefined") {
    __orientaPaxChatPending_[body.slice(0, 120)] = Date.now();
  }

  if (ws && ws.readyState === WebSocket.OPEN) {
    try {
      ws.send(JSON.stringify({ type: "chat_send", tenantId, passengerId, body, kind: "text" }));
      if (typeof OrientaMetrics !== "undefined") {
        OrientaMetrics.emit({
          name: "pax.chat.send",
          category: "chat",
          role: "pax",
          ok: true,
          props: { transport: "ws_dispatch" },
        });
      }
      ta.value = "";
      return;
    } catch (eWsSend) {
      /* fall through — try HTTP fallback */
    }
  }

  orientaTrySendChatHttp_(body, ta).catch(function () {
    if (typeof OrientaMetrics !== "undefined") {
      OrientaMetrics.emit({
        name: "pax.chat.send",
        category: "chat",
        role: "pax",
        ok: false,
        props: { transport: "failed" },
      });
      delete __orientaPaxChatPending_[body.slice(0, 120)];
    }
    var nowMs = Date.now();
    if (nowMs - __orientaWsSendWarnLastMs >= 2800) {
      __orientaWsSendWarnLastMs = nowMs;
      try {
        showNotifyNoAck(
          "仍然无法发送：WebSocket（/ws）未就绪，且 HTTP 退路 /api/pax/chat-send 也失败（可在 Network 面板查看）。经隧道时请确认 HTTP 页面与接口同源可达；局域网请试 https://局域网IP:5443 。"
        );
      } catch (eSn) {}
    }
    refreshWsTransportUiState();
  });
}

/** Banner that does not call `ws.send` (avoid ack while socket is unhealthy). */
function showNotifyNoAck(body) {
  const container = document.getElementById("notifyBanners");
  const div = document.createElement("div");
  div.className = "notify-banner";
  div.innerHTML =
    '<span class="dismiss" onclick="this.parentElement.remove()">×</span><strong>⚠️</strong> ' +
    body.replace(/</g, "&lt;");
  container.appendChild(div);
  setTimeout(() => {
    try {
      div.remove();
    } catch (eRm) {}
  }, 14000);
}

// ─── Notifications ─────────────────────────────────────────────
function showNotify(body, messageId) {
  const container = document.getElementById("notifyBanners");
  const div = document.createElement("div");
  div.className = "notify-banner";
  div.innerHTML = `<span class="dismiss" onclick="this.parentElement.remove()">×</span>📨 ${body}`;
  container.appendChild(div);
  // Auto-dismiss after 8s
  setTimeout(() => { try { div.remove(); } catch {} }, 8000);
  // Send ack
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: "ack", tenantId, passengerId, messageId }));
  }
}

function showLocRequest() {
  showNotify("Orienta is requesting your current location. Please share it below.", "_loc_req_" + Date.now());
  document.getElementById("locBtn").style.background = "#ff9f0a";
  document.getElementById("locStatus").textContent = "⚠️ Location requested by operator";
}

async function enablePhonePush() {
  const btn = document.getElementById("pushBtn");
  const hint = document.getElementById("pushHint");
  if (btn) btn.disabled = true;
  if (hint) hint.textContent = "";
  try {
    const keyRes = await fetch("/api/push/vapidPublicKey");
    const keyJson = await keyRes.json();
    if (!keyRes.ok || !keyJson.ok || !keyJson.publicKey) throw new Error("服务端未配置 VAPID");

    const perm = await Notification.requestPermission();
    if (perm !== "granted") throw new Error("通知权限未授予");

    const reg = await navigator.serviceWorker.register("/sw.js");
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64ToU8(String(keyJson.publicKey)),
    }));
    const r = await fetch("/api/push/subscribe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tenantId: tenantId, passengerId: passengerId, subscription: sub.toJSON() }),
    });
    const j = await r.json().catch(function () { return {}; });
    if (!r.ok || !j.ok) throw new Error(j.error || "订阅失败");
    if (hint) hint.textContent = "✅ 已开启，离开 30 秒会收到系统提醒。";
    showNotify("✅ 手机通知已开启。", "_push_ok");
  } catch (e) {
    if (hint) hint.textContent = "开启失败：" + ((e && e.message) ? e.message : String(e));
  } finally {
    if (btn) btn.disabled = false;
  }
}

// ─── Location ──────────────────────────────────────────────────
/** Orienta route / video–synced position (route_site), not device GPS. */
function orientaGetPassengerTrackedLocation_() {
  try {
    pingRouteSiteTouristPush();
  } catch (ePing) {}
  try {
    var raw = orientaCallRouteSiteTouristFn_("orientaDumpTouristPosition");
    if (
      raw &&
      typeof raw.lat === "number" &&
      typeof raw.lng === "number" &&
      Number.isFinite(raw.lat) &&
      Number.isFinite(raw.lng)
    ) {
      return { lat: raw.lat, lng: raw.lng, source: "route" };
    }
  } catch (eRt) {}
  if (
    orientaLastKnownPos_ &&
    typeof orientaLastKnownPos_.lat === "number" &&
    typeof orientaLastKnownPos_.lng === "number" &&
    Number.isFinite(orientaLastKnownPos_.lat) &&
    Number.isFinite(orientaLastKnownPos_.lng)
  ) {
    return { lat: orientaLastKnownPos_.lat, lng: orientaLastKnownPos_.lng, source: "relay" };
  }
  return null;
}

function shareLocation() {
  var locStatus = document.getElementById("locStatus");
  var locBtn = document.getElementById("locBtn");
  locStatus.textContent = "正在读取导航推算位置…";
  var tracked = orientaGetPassengerTrackedLocation_();
  if (!tracked) {
    locStatus.textContent = "暂无导航追踪位置";
    alert(
      "请先打开「视频」或导航页面并开始路线，再使用 Share Location 分享 Orienta 推算位置（非手机 GPS）。"
    );
    return;
  }
  var lat = tracked.lat;
  var lng = tracked.lng;
  var srcNote =
    tracked.source === "route"
      ? ""
      : tracked.source === "relay"
        ? "（最近同步）"
        : "（起始点）";
  var body = "📍 导航推算位置: " + lat.toFixed(6) + ", " + lng.toFixed(6) + srcNote;

  function onShared() {
    locStatus.textContent = "已分享位置：" + lat.toFixed(4) + ", " + lng.toFixed(4);
    locBtn.style.background = "#34c759";
  }

  if (ws && ws.readyState === WebSocket.OPEN) {
    try {
      ws.send(JSON.stringify({ type: "chat_send", tenantId, passengerId, body: body, kind: "location" }));
      onShared();
      return;
    } catch (eWs) {
      /* HTTP fallback */
    }
  }

  orientaTrySendChatHttp_(body, null, "location")
    .then(onShared)
    .catch(function () {
      var nowMs = Date.now();
      if (nowMs - __orientaWsSendWarnLastMs >= 2800) {
        __orientaWsSendWarnLastMs = nowMs;
        try {
          showNotifyNoAck(
            "无法分享位置：WebSocket 未就绪且 /api/pax/chat-send 失败。请确认网络与同源接口可达。"
          );
        } catch (eSn) {}
      }
      locStatus.textContent = "分享失败";
      refreshWsTransportUiState();
    });
}

// ─── 对话 / 视频页 切换 ─────────────────────────────────────────
function setMainView(mode) {
  const chat = document.getElementById("panelChat");
  const video = document.getElementById("panelVideo");
  const tChat = document.getElementById("tabChat");
  const tVideo = document.getElementById("tabVideo");
  const isChat = mode === "chat";
  chat.style.display = isChat ? "flex" : "none";
  video.style.display = isChat ? "none" : "flex";
  tChat.classList.toggle("active", isChat);
  tVideo.classList.toggle("active", !isChat);
  tChat.setAttribute("aria-selected", isChat ? "true" : "false");
  tVideo.setAttribute("aria-selected", isChat ? "false" : "true");
  if (!isChat) onVideoTabShown();
}

document.getElementById("tabChat").addEventListener("click", function () { setMainView("chat"); });
document.getElementById("tabVideo").addEventListener("click", function () { setMainView("video"); });

var initialView = (params.get("view") || "chat").toLowerCase();
if (initialView === "video") setMainView("video");

// Show push button in this page (not wrapper), so user can always see it.
(function initPushUi() {
  const wrap = document.getElementById("pushWrap");
  const btn = document.getElementById("pushBtn");
  const hint = document.getElementById("pushHint");
  if (!wrap || !btn || !hint) return;
  if (!isPushSupported()) {
    wrap.style.display = "block";
    hint.textContent = "当前环境不支持 Web Push。";
    return;
  }
  wrap.style.display = "block";
  if (Notification.permission === "granted") {
    hint.textContent = "通知权限已允许。可直接测试离开提醒。";
  } else {
    hint.textContent = "点击开启手机通知（建议在主屏独立 App 模式下操作）。";
    btn.addEventListener("click", enablePhonePush);
  }
})();

// Page away/back heartbeat for 30s push reminder.
document.addEventListener("visibilitychange", function () {
  const body = JSON.stringify({ tenantId: tenantId, passengerId: passengerId, awayMs: 30000 });
  try {
    if (document.hidden) {
      if (navigator.sendBeacon) {
        navigator.sendBeacon("/api/pax/away", new Blob([body], { type: "application/json" }));
      } else {
        fetch("/api/pax/away", { method: "POST", headers: { "Content-Type": "application/json" }, body: body });
      }
    } else {
      const back = JSON.stringify({ tenantId: tenantId, passengerId: passengerId });
      if (navigator.sendBeacon) {
        navigator.sendBeacon("/api/pax/back", new Blob([back], { type: "application/json" }));
      } else {
        fetch("/api/pax/back", { method: "POST", headers: { "Content-Type": "application/json" }, body: back });
      }
    }
  } catch (e) {}
});
