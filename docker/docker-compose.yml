# Offline / demo compose — image only, no build context.
# Load orienta-v3-dashboard:latest first, then:
#   docker compose --env-file .env up -d
services:
  orienta:
    image: orienta-v3-dashboard:latest
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-5174}:5174"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "5174"
      NODE_ENV: production
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env}"
      JWT_SECRET_PREVIOUS: "${JWT_SECRET_PREVIOUS:-}"
      ADMIN_CREDENTIALS: "${ADMIN_CREDENTIALS:?set ADMIN_CREDENTIALS}"
      PAX_ACCOUNT_CREDENTIALS: "${PAX_ACCOUNT_CREDENTIALS:-}"
      KIOSK_SCAN_SECRET: "${KIOSK_SCAN_SECRET:?set KIOSK_SCAN_SECRET}"
      ADMIN_ROLES: "${ADMIN_ROLES:-}"
      ADMIN_TENANT_SCOPES: "${ADMIN_TENANT_SCOPES:-}"
      TOURIST_ALLOWED_ORIGINS: "${TOURIST_ALLOWED_ORIGINS:-}"
      PDR_API_ORIGIN: "${PDR_API_ORIGIN:-}"
      INDOOR_MAP_UPSTREAM: "${INDOOR_MAP_UPSTREAM:-http://host.docker.internal:7801}"
      INDOOR_MAP_API_UPSTREAM: "${INDOOR_MAP_API_UPSTREAM:-http://host.docker.internal:7801}"
      VITE_LOCAL_AIRPORT_MAP: "${VITE_LOCAL_AIRPORT_MAP:-0}"
      FLIGHTAWARE_API_KEY: "${FLIGHTAWARE_API_KEY:-}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:ops@orienta.ai}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_FROM_NUMBER: "${TWILIO_FROM_NUMBER:-}"
      SMS_DEFAULT_COUNTRY_CODE: "${SMS_DEFAULT_COUNTRY_CODE:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"
      SMTP_SECURE: "${SMTP_SECURE:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-}"
      SENTRY_RELEASE: "${SENTRY_RELEASE:-}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      ROUTE_SITE_DEFAULT_TENANT: "${ROUTE_SITE_DEFAULT_TENANT:-airchina}"
      DEFAULT_AIRPORT: "${DEFAULT_AIRPORT:-PEK}"
      DEFAULT_TERMINAL: "${DEFAULT_TERMINAL:-T3E}"
      AIRPORT_CONFIG_DIR: "${AIRPORT_CONFIG_DIR:-}"
      INSTANCE_ID: "${INSTANCE_ID:-}"
      DB_PATH: /app/data/passengers.db
      DATABASE_URL: "${DATABASE_URL:-}"
      REDIS_URL: "${REDIS_URL:-}"
    volumes:
      - orienta-data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

volumes:
  orienta-data:
